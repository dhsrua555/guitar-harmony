<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공유 미리보기 이미지 (1200×630)</title>
<!-- 링크 미리보기용 og-image.png 를 만드는 페이지. 1200×630 으로 캡처해 저장소 맨 위에 둔다 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bayon&family=Black+Han+Sans&family=Kalam:wght@700&family=Noto+Sans+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&text=%F0%9D%84%9E&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #F3F1E6; }
  body { position: relative; font-family: "Noto Sans KR", sans-serif; color: #1F1B17; }
  .copy { position: absolute; left: 76px; top: 62px; width: 600px; }
  .eyebrow { margin: 0 0 18px; color: #D2372A; font-family: Bayon, sans-serif; font-size: 26px; letter-spacing: .16em; }
  h1 { margin: 0; font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 118px; line-height: 1.02; letter-spacing: -.01em; }
  h1 .amp { color: #D2372A; }
  .sub { margin: 22px 0 0; font-size: 34px; font-weight: 700; letter-spacing: -.03em; color: #48423A; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .chip { position: relative; z-index: 0; padding: 8px 18px 9px; font-size: 22px; font-weight: 700; }
  .chip svg { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; overflow: visible; }
  .art { position: absolute; right: 26px; top: 40px; width: 560px; height: 440px; }
  .band { position: absolute; left: -40px; right: -40px; bottom: 24px; height: 66px; background: #D2372A; transform: rotate(-1.6deg); display: flex; align-items: center; gap: 30px; padding-left: 70px; color: #FFF9EE; font-family: Bayon, sans-serif; font-size: 40px; letter-spacing: .05em; white-space: nowrap; }
  .band .dot { width: 12px; height: 12px; border-radius: 50%; background: #FFE24F; }
  .ink { fill: none; stroke: #1F1B17; stroke-linecap: round; }
  .grain { mix-blend-mode: multiply; opacity: .45; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="gh-noise" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.14  0 0 0 0 0.12  0 0 0 3.4 -2.05"/></filter>
  <pattern id="gh-grain-pat" width="160" height="160" patternUnits="userSpaceOnUse"><rect width="160" height="160" filter="url(#gh-noise)"/></pattern>
</defs></svg>
<div class="copy">
  <p class="eyebrow">GUITAR · HARMONY · EAR TRAINING</p>
  <h1>기타 <span class="amp">&amp;</span><br>화성학</h1>
  <p class="sub">보고, 듣고, 기타로 쳐 보는 화성학</p>
  <div class="chips" id="chips"></div>
</div>
<svg class="art" id="art" viewBox="0 0 540 420"></svg>
<div class="band"><span>CHORDS</span><i class="dot"></i><span>SCALES</span><i class="dot"></i><span>PROGRESSIONS</span><i class="dot"></i><span>EAR TRAINING</span><i class="dot"></i><span>RHYTHM</span><i class="dot"></i><span>LICKS</span></div>
<svg width="1200" height="630" style="position:absolute;inset:0;pointer-events:none"><rect class="grain" width="1200" height="630" fill="url(#gh-grain-pat)"/></svg>
<script>window.GH = {};</script>
<script src="../js/ui.js"></script>
<script src="../js/render/sketch.js"></script>
<script>
  const K = GH.sketch, S = GH.ui.svg, art = document.getElementById('art');
  const add = (tag, attrs) => { const e = S(tag, attrs); art.appendChild(e); return e; };
  add('path', { d: K.blob(303, 215, 187, 186, { points: 14, wobble: 0.02 }), fill: '#F4C3BE' });
  add('path', { d: K.hatchCircle(300, 212, 184, { gap: 7, from: 0.62 }), class: 'ink', 'stroke-width': 1.2, opacity: .22 });
  add('path', { d: K.ellipse(300, 212, 188, 188, { points: 26, overshoot: 0.05, wobble: 0.012 }), class: 'ink', 'stroke-width': 2, opacity: .85 });
  add('path', { d: K.ellipse(300, 212, 206, 206, { points: 30, overshoot: 0.02, wobble: 0.01 }), class: 'ink', 'stroke-width': 1.3, 'stroke-dasharray': '2 9', opacity: .55 });
  let staff = ''; [170, 190, 210, 230, 250].forEach(y => { staff += K.line(22, y, 522, y, { passes: 2, bow: 1.4, overshoot: 2 }); });
  add('path', { d: staff, class: 'ink', 'stroke-width': 1.8 });
  add('text', { x: 34, y: 262, 'font-size': 112, 'font-family': '"Noto Music", serif', fill: '#1F1B17' }).textContent = '\u{1D11E}';
  const M = [{ x: 150, y: 230, up: 1 }, { x: 215, y: 220, up: 1 }, { x: 280, y: 200 }, { x: 345, y: 190 }, { x: 410, y: 180 }, { x: 470, y: 160 }];
  M.forEach((p, i) => {
    const sx = p.x + (p.up ? 11 : -11);
    add('path', { d: K.line(sx, p.y + (p.up ? -3 : 3), sx, p.y + (p.up ? -62 : 62), { passes: 2, overshoot: 1, jitter: 0.8 }), class: 'ink', 'stroke-width': 2.4 });
    add('path', { d: K.blob(p.x, p.y, 13, 9.5, { points: 9, wobble: 0.08 }), fill: i === 2 ? '#D2372A' : '#1F1B17', transform: `rotate(-22 ${p.x} ${p.y})` });
  });
  [[0, 1], [2, 3], [4, 5]].forEach(([a, b]) => {
    const A = M[a], B = M[b], sx = p => p.x + (p.up ? 11 : -11), ey = p => p.y + (p.up ? -62 : 62), t = A.up ? 9 : -9;
    add('path', { d: `M${sx(A) - 1},${ey(A)} L${sx(B) + 1.5},${ey(B)} L${sx(B) + 1},${ey(B) + t} L${sx(A) - 1.5},${ey(A) + t} Z`, fill: '#1F1B17' });
  });
  const bx = 342, by = 118;
  add('path', { d: K.blob(bx + 0.8, by + 0.6, 17, 16.6, { points: 9, wobble: 0.05 }), fill: '#FFE24F' });
  add('path', { d: K.ellipse(bx, by, 17.4, 17, { points: 11 }), class: 'ink', 'stroke-width': 2.2 });
  add('path', { d: `M${bx - 7} ${by - 9}C${bx - 3} ${by - 12} ${bx + 3} ${by - 12} ${bx + 7} ${by - 9}`, fill: 'none', stroke: '#fff', 'stroke-width': 2.2, 'stroke-linecap': 'round' });
  /* 손으로 그린 알약 모양 칩 */
  const chips = document.getElementById('chips');
  ['코드', '스케일', '코드 진행', '음감 퀴즈', '백킹 트랙'].forEach((t, i) => {
    const c = document.createElement('span'); c.className = 'chip'; c.textContent = t; chips.appendChild(c);
    requestAnimationFrame(() => {
      const w = c.offsetWidth, h = c.offsetHeight, s = S('svg', { viewBox: `0 0 ${w} ${h}` });
      s.appendChild(S('path', { d: K.curve([[h / 2, 1], [w - h / 2, 1.5], [w - 1, h / 2], [w - h / 2, h - 1], [h / 2, h - 1.5], [1.5, h / 2]], true), class: 'ink', 'stroke-width': 2, style: i === 0 ? 'fill:#FFE24F' : '' }));
      c.insertBefore(s, c.firstChild);
    });
  });
</script>
</body>
</html>
